image: node:20

stages:
  - build
  - test

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

build_job:
  stage: build
  tags:
    - docker
  script:
    - npm ci           
    - npm run build  
  artifacts:
    paths:
      - dist/          

test_job:
  stage: test
  script:
    - npm ci
    - npm run test     
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/' 