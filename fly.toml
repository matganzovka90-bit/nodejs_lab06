# fly.toml app configuration file generated for lab05-nameless-overbrook-862 on 2026-05-07T12:52:16+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lab05-nameless-overbrook-862'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[services.http_checks]]
    interval = "10s"       
    grace_period = "5s"     
    method = "get"
    path = "/health"   
    port = 3000
    protocol = "http"
    timeout = "2s"

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
